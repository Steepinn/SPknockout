name: SPknockout
version: '1.2.4'
main: ru.knockout.plugin.KnockoutPlugin
api-version: '1.21'
description: Нокаут, спасение, самоподъём и админ-команда
commands:
  die:
    description: Сдаться в нокауте (смерть и выпадение лута)
    usage: /die
  knockout:
    description: Управление плагином нокаута
    usage: /knockout reload
  recovery:
    description: Мгновенно поднять игрока из нокаута (админ)
    usage: /recovery <player>
permissions:
  knockout.admin.reload:
    description: Разрешает перезагружать конфиг нокаута
    default: op
  knockout.admin.recovery:
    description: Разрешает поднимать игроков из нокаута командой recovery
    default: op
